<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar de Leads Pautando — Reporte</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    background: radial-gradient(ellipse at 12% -10%, #0050c4 0%, #000b19 42%, #000b19 100%);
    color: #ffffff; min-height: 100vh; padding: 32px 20px 60px;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }
  a { color: #7db4ff; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 28px; flex-wrap: wrap; }
  .header-brand { display: flex; align-items: center; gap: 10px; }
  .wordmark-svg { width: 100px; height: 25px; color: #ffffff; display: block; flex-shrink: 0; }
  .tag { font-size: 11px; color: #9ca3af; border-left: 1px solid rgba(255,255,255,0.2); padding-left: 8px; }

  .agency-logo-wrap {
    display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 6px 14px;
  }
  .agency-logo-wrap img { height: 22px; max-width: 140px; object-fit: contain; display: block; }
  .agency-logo-wrap span { font-size: 11px; color: #9ca3af; font-weight: 600; }

  .title-block { text-align: center; margin-bottom: 30px; }
  .hero-pill {
    display: table; margin: 0 auto 16px; align-items: center; gap: 8px;
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em;
    color: #7db4ff; background: rgba(0,80,195,0.15); border: 1px solid rgba(0,80,195,0.35);
    padding: 6px 14px; border-radius: 100px;
  }
  .hero-pulse {
    width: 8px; height: 8px; border-radius: 50%; background: #59d98a; display: inline-block; margin-right: 6px;
    box-shadow: 0 0 0 0 rgba(89,217,138,0.6); animation: rl-pulse 2s infinite; vertical-align: middle;
  }
  @keyframes rl-pulse {
    0% { box-shadow: 0 0 0 0 rgba(89,217,138,0.5); }
    70% { box-shadow: 0 0 0 9px rgba(89,217,138,0); }
    100% { box-shadow: 0 0 0 0 rgba(89,217,138,0); }
  }
  h1 { font-size: clamp(24px, 4vw, 34px); font-weight: 800; margin: 0 auto 8px; letter-spacing: -0.01em; max-width: 720px; }
  h1 em {
    font-family: Georgia, serif; font-style: italic; font-weight: 400;
    background: linear-gradient(120deg, #7db4ff, #59d98a);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .sub { color: #9ca3af; font-size: 13px; margin: 0 auto; max-width: 480px; }
  .updated { font-size: 11px; color: #6b7280; margin: 10px auto 26px; text-align: center; }

  /* ---- Card de lead: mismo diseño que la app interna (rl-row) ---- */
  .rl-table-wrap { display: flex; flex-direction: column; gap: 12px; }
  .rl-row {
    background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
    padding: 18px 20px;
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    transition: all 0.2s;
  }
  .rl-row:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.2); }

  .rl-row-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .rl-brand { display: flex; align-items: center; gap: 10px; min-width: 180px; }
  .rl-avatar {
    width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #0050c3, #3d7fe0); color: white;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px;
    flex-shrink: 0;
  }
  .rl-brand-name { font-weight: 700; font-size: 14.5px; color: #ffffff; }
  .rl-domain { font-size: 12px; color: #6b7280; font-family: 'JetBrains Mono', monospace; }
  .rl-domain a { color: #6b7280; text-decoration: none; }

  .rl-meta { display: flex; gap: 22px; flex-wrap: wrap; align-items: center; }
  .rl-meta-item { font-size: 12px; color: #9ca3af; }
  .rl-meta-item b { color: #ffffff; font-weight: 700; }

  .rl-badge { display: inline-block; padding: 3px 10px; border-radius: 100px; font-size: 11px; font-weight: 700; }
  .rl-badge.plat-none { background: rgba(255,167,122,0.14); color: #ffb27a; }
  .rl-badge.plat-custom { background: rgba(255,107,107,0.14); color: #ff9494; }
  .rl-badge.plat-shopify { background: rgba(89,217,138,0.14); color: #6be3a0; }
  .rl-badge.plat-vtex { background: rgba(255,105,180,0.16); color: #ff8fc4; }
  .rl-badge.plat-woocommerce { background: rgba(160,100,255,0.16); color: #b892ff; }
  .rl-badge.plat-other { background: rgba(255,255,255,0.08); color: #b8c0cc; }
  .rl-badge.plat-unknown { background: rgba(255,255,255,0.06); color: #6b7280; }
  .rl-badge.estado-nuevo { background: rgba(0,80,195,0.18); color: #7db4ff; }
  .rl-badge.estado-asignado { background: rgba(255,209,102,0.14); color: #ffd166; }

  .rl-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .rl-btn {
    background: rgba(255,255,255,0.05); color: #ffffff; border: 1px solid rgba(255,255,255,0.25);
    border-radius: 100px; padding: 7px 14px; font-weight: 700; font-size: 12px; cursor: pointer;
    white-space: nowrap; transition: all 0.2s;
  }
  .rl-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.5); }

  .rl-pipeline-select {
    background: rgba(0,0,0,0.3); color: #ffffff; border: 1px solid rgba(255,255,255,0.25);
    border-radius: 100px; padding: 6px 12px; font-weight: 700; font-size: 12px; cursor: pointer;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .rl-pipeline-select option { color: #14213D; }

  .rl-copy-btn {
    background: transparent; color: #9ca3af; border: 1px solid rgba(255,255,255,0.15);
    border-radius: 100px; padding: 3px 10px; font-weight: 700; font-size: 10.5px; cursor: pointer;
    white-space: nowrap; transition: all 0.2s; flex-shrink: 0;
  }
  .rl-copy-btn:hover { background: rgba(255,255,255,0.08); color: #ffffff; border-color: rgba(255,255,255,0.4); }

  .rl-detail {
    margin-top: 14px; padding-top: 14px; border-top: 1px dashed rgba(255,255,255,0.12);
    font-size: 13px; line-height: 1.6; color: #cbd2dc; display: flex; flex-direction: column; gap: 8px;
  }
  .rl-detail a { word-break: break-all; }

  .empty { text-align: center; padding: 60px 20px; color: #6b7280; }
  .error { text-align: center; padding: 60px 20px; color: #ff8a8a; }
  footer { text-align: center; color: #4b5875; font-size: 11px; margin-top: 40px; }

  /* ---- Tabla de seguimiento (solo vista admin) ---- */
  .rl-track-title { font-size: 15px; font-weight: 800; color: #ffffff; margin: 40px 0 12px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .rl-track-title span.count { color: #9ca3af; font-weight: 600; font-size: 12.5px; margin-left: 8px; }
  .rl-track-filtro {
    background: rgba(0,0,0,0.3); color: #fff; border: 1px solid rgba(255,255,255,0.16); border-radius: 8px;
    padding: 7px 12px; font-size: 12.5px; font-family: 'Plus Jakarta Sans', sans-serif; cursor: pointer;
  }
  .rl-track-filtro option { color: #14213D; }
  .rl-track-wrap {
    background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.09); border-radius: 16px;
    overflow-x: auto; margin-bottom: 18px;
  }
  .rl-track-table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 640px; }
  .rl-track-table th {
    text-align: left; padding: 12px 14px; color: #7db4ff; font-size: 10.5px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid rgba(255,255,255,0.1);
    white-space: nowrap;
  }
  .rl-track-table td { padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.06); color: #cbd2dc; vertical-align: top; }
  .rl-track-table tr:last-child td { border-bottom: none; }
  .rl-track-table tr:hover td { background: rgba(255,255,255,0.02); }
  .rl-track-brand { color: #ffffff; font-weight: 700; display: block; }
  .rl-track-domain { color: #6b7280; font-size: 11px; }
  .rl-track-empty { padding: 30px 24px; text-align: center; color: #6b7280; font-size: 13px; }

  /* ---- Resumen de fases (vista de agencia) ---- */
  .rl-resumen { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; justify-content: center; }
  .rl-chip {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
    padding: 10px 18px; font-size: 12px; font-weight: 600; backdrop-filter: blur(8px);
    cursor: pointer; transition: all 0.2s;
  }
  .rl-chip:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.25); }
  .rl-chip b { font-size: 17px; display: block; font-weight: 800; margin-bottom: 2px; }
  .rl-chip.activo { border-width: 2px; }

  .rl-fase-title {
    font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
    margin: 26px 0 10px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .rl-fase-group:first-of-type .rl-fase-title { margin-top: 0; }
</style>
</head>

  <div class="title-block">
    <div class="hero-pill"><span class="hero-pulse"></span>Radar de Leads · Reporte en vivo</div>
    <h1 id="titulo">Radar de Leads Pautando — Reporte</h1>
    <div class="sub" id="subtitulo">Vista de solo lectura. Para buscar candidatos nuevos, asignar o generar guiones, usa la app interactiva en Claude.</div>

</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const tokenAgencia = params.get('agencia');
  let agenciaFiltro = null; // se resuelve tras cargar leads.json (traduce el token a nombre real)

  let infoAbierta = {};
  let guionAbierto = {};

  function linkify(text){
    if(!text) return '';
    const escaped = String(text).replace(/</g,'&lt;');
    const urlPattern = /(https?:\/\/[^\s,)]+|(?:www\.)?[a-z0-9-]+\.(?:com|mx|co|net|org|io)(?:\.[a-z]{2,3})?(?:\/[^\s,)]*)?)/gi;
    return escaped.replace(urlPattern, (match) => {
      const href = match.startsWith('http') ? match : 'https://' + match;
      return `<a href="${href}" target="_blank" rel="noopener" style="color:#7db4ff; text-decoration:underline;">${match}</a>`;
    });
  }

  function iniciales(dominio){
    const marca = (dominio||'?').replace(/^www\./,'').split('.')[0];
    return marca.substring(0,2).toUpperCase();
  }

  function badgeEstado(e){
    const cls = e === 'Asignado' ? 'estado-asignado' : 'estado-nuevo';
    return '<span class="rl-badge '+cls+'">'+ (e || 'Nuevo') + '</span>';
  }

  const PIPELINE_COLORES = {
    'Lead': { bg: 'rgba(255,255,255,0.08)', color: '#b8c0cc' },
    'Reunión': { bg: 'rgba(0,80,195,0.18)', color: '#7db4ff' },
    'Negociando': { bg: 'rgba(255,209,102,0.14)', color: '#ffd166' },
    'Ganado': { bg: 'rgba(89,217,138,0.14)', color: '#6be3a0' },
    'Perdido': { bg: 'rgba(255,107,107,0.14)', color: '#ff9494' }
  };

  function badgePipeline(status){
    const s = status || 'Lead';
    const c = PIPELINE_COLORES[s] || PIPELINE_COLORES['Lead'];
    return `<span class="rl-badge" style="background:${c.bg}; color:${c.color};">${s}</span>`;
  }

  function badgePlataforma(p){
    if(!p) return '<span class="rl-badge plat-unknown">Sin revisar</span>';
    const low = p.toLowerCase();
    if(low.includes('solo rrss') || low.includes('sin sitio')) return '<span class="rl-badge plat-none">Sin sitio — solo RRSS</span>';
    if(low.includes('sitio propio')) return '<span class="rl-badge plat-custom">Desarrollo propio</span>';
    if(low.includes('shopify')) return '<span class="rl-badge plat-shopify">Shopify</span>';
    if(low.includes('vtex')) return '<span class="rl-badge plat-vtex">VTEX</span>';
    if(low.includes('woocommerce')) return '<span class="rl-badge plat-woocommerce">WooCommerce</span>';
    return '<span class="rl-badge plat-other">'+ p + '</span>';
  }

  const CANALES_CONOCIDOS = ['Meta:', 'TikTok:', 'Google:'];

  // Recorta el texto de ads_activos a solo la clausula del canal pedido (hasta el
  // siguiente canal o punto y coma), para no mezclar datos de Meta/TikTok/Google entre si.
  function extraerSegmentoCanal(texto, nombre){
    if(!texto) return null;
    const idx = texto.toLowerCase().indexOf(nombre.toLowerCase() + ':');
    if(idx === -1) return null;
    const resto = texto.substring(idx);
    let fin = resto.length;
    const idxPuntoYComa = resto.indexOf(';');
    if(idxPuntoYComa !== -1) fin = Math.min(fin, idxPuntoYComa);
    CANALES_CONOCIDOS.forEach(canal => {
      if(canal.toLowerCase() === nombre.toLowerCase()+':') return;
      const i = resto.toLowerCase().indexOf(canal.toLowerCase());
      if(i > 0) fin = Math.min(fin, i);
    });
    return resto.substring(0, fin);
  }

  function detectarCanal(texto, nombre){
    const seg = extraerSegmentoCanal(texto, nombre);
    if(!seg) return 'unknown';
    if(/no encontrado|no confirmado|:\s*no\b|no,/i.test(seg)) return 'inactive';
    return 'active';
  }

  function extraerLink(texto, nombre){
    const seg = extraerSegmentoCanal(texto, nombre);
    if(!seg) return null;
    // 1. URL explicita a una red social conocida (evita enlazar al sitio propio de la marca)
    const urlSocial = seg.match(/(https?:\/\/[^\s,)\]]+|(?:www\.)?(?:facebook|instagram|tiktok)\.com\/[^\s,)\]]+)/i);
    if(urlSocial) return urlSocial[0].startsWith('http') ? urlSocial[0] : 'https://' + urlSocial[0];
    // 2. @handle mencionado en la clausula de este canal especifico
    const handleMatch = seg.match(/@([a-zA-Z0-9_.]+)/);
    if(handleMatch){
      const handle = handleMatch[1].replace(/\.$/, '');
      if(nombre === 'TikTok') return 'https://www.tiktok.com/@' + handle;
      if(nombre === 'Meta') return 'https://www.instagram.com/' + handle;
    }
    return null;
  }

  function iconoCanal(letra, color, estado, link){
    const opacidad = estado === 'active' ? '1' : (estado === 'inactive' ? '0.25' : '0.4');
    const contenido = `<span style="display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:7px; background:${color}; color:#fff; font-size:11px; font-weight:800; opacity:${opacidad};" title="${estado === 'active' ? 'Pautando activo' : (estado === 'inactive' ? 'No encontrado' : 'Sin revisar')}">${letra}</span>`;
    return (estado === 'active' && link) ? `<a href="${link}" target="_blank" rel="noopener">${contenido}</a>` : contenido;
  }

  function renderAdsIconos(texto){
    if(!texto) return '';
    const canales = [
      { nombre: 'Meta', letra: 'M', color: '#0866ff' },
      { nombre: 'Google', letra: 'G', color: '#ea4335' },
      { nombre: 'TikTok', letra: 'T', color: '#000000' }
    ];
    return canales.map(c => {
      const estado = detectarCanal(texto, c.nombre);
      const link = extraerLink(texto, c.nombre);
      return iconoCanal(c.letra, c.color, estado, link);
    }).join(' ');
  }

  window.rlToggleInfo = function(dominio){
    infoAbierta[dominio] = !infoAbierta[dominio];
    render(window.__leads || []);
  };

  window.rlToggleGuion = function(dominio){
    guionAbierto[dominio] = !guionAbierto[dominio];
    render(window.__leads || []);
  };

  const PIPELINE_OPCIONES = ['Lead', 'Reunión', 'Negociando', 'Ganado', 'Perdido'];

  // Logo de cada agencia (archivos en sitio-vercel/logos/), pendiente de agregar
  const AGENCIA_LOGOS = {};
  const basePath = window.location.pathname.endsWith('/') ? window.location.pathname : window.location.pathname + '/';

  window.rlCambiarPipeline = function(select){
    const dominio = select.dataset.dominio;
    const estado = select.value;
    const lead = (window.__leads || []).find(l => l.dominio === dominio);
    if(lead) lead.pipeline_status = estado;
    render(window.__leads || []); // refleja la etiqueta nueva de inmediato

    // El select original se reemplazo al re-renderizar; buscamos el nodo fresco para el feedback
    const buscarSelect = () => document.querySelector(`.rl-pipeline-select[data-dominio="${dominio}"]`);

    fetch('/api/pipeline', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dominio, estado })
    })
      .then(r => r.json().then(data => { if(!r.ok) throw new Error(data.error || 'Error al guardar'); }))
      .then(() => {
        const sel = buscarSelect();
        if(sel){ sel.style.borderColor = '#59d98a'; setTimeout(() => { if(sel) sel.style.borderColor = ''; }, 1200); }
      })
      .catch(err => {
        const sel = buscarSelect();
        if(sel){ sel.style.borderColor = '#ff6b6b'; sel.title = 'No se pudo guardar: ' + err.message; }
        console.error('Error guardando pipeline_status:', err);
      });
  };

  function escapeAttr(s){
    return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  }

  function botonCopiar(texto){
    return `<button class="rl-copy-btn" data-copy="${escapeAttr(texto)}" onclick="rlCopiarSeccion(this)">Copiar</button>`;
  }

  function copiarAlPortapapeles(texto){
    if(navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(texto).catch(() => copiarConFallback(texto));
    }
    copiarConFallback(texto);
    return Promise.resolve();
  }

  function copiarConFallback(texto){
    const ta = document.createElement('textarea');
    ta.value = texto;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
  }

  window.rlCopiarSeccion = function(btn){
    const texto = btn.dataset.copy || '';
    const original = btn.textContent;
    copiarAlPortapapeles(texto).then(() => {
      btn.textContent = 'Copiado ✓';
      setTimeout(() => { btn.textContent = original; }, 1500);
    });
  };

  function formatearGuion(textoOriginal){
    if(!textoOriginal) return '';
    const colorTexto = '#cbd2dc';
    const colorBorde = 'rgba(255,255,255,0.12)';
    const patronHeaders = /(ANGULO DE VENTA|MENSAJE DE PRIMER CONTACTO(?:\s*\([^)]*\))?|OBJECIONES PROBABLES)/gi;
    const infoPorHeader = {
      'angulo de venta': { icono: '🎯', titulo: 'Ángulo de venta', color: '#7db4ff' },
      'mensaje de primer contacto': { icono: '💬', titulo: 'Mensaje de primer contacto', color: '#59d98a' },
      'objeciones probables': { icono: '🛡️', titulo: 'Objeciones probables', color: '#ffd166' }
    };
    const partes = textoOriginal.split(patronHeaders);
    if(partes.length < 2){
      const texto = textoOriginal.trim();
      return `<div style="display:flex; justify-content:flex-end; margin-bottom:6px;">${botonCopiar(texto)}</div>
        <p style="color:${colorTexto}; line-height:1.65;">${linkify(texto)}</p>`;
    }
    let html = '';
    if(partes[0] && partes[0].trim()) html += `<p style="margin-bottom:14px; color:${colorTexto}; line-height:1.6;">${linkify(partes[0].trim())}</p>`;
    for(let i=1; i<partes.length; i+=2){
      const clave = partes[i].toLowerCase().replace(/\s*\([^)]*\)/,'').trim();
      const contenido = (partes[i+1]||'').trim();
      const info = infoPorHeader[clave] || { icono: '📌', titulo: partes[i], color: '#9ca3af' };
      html += `<div style="margin-bottom:18px;">
        <div style="margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; gap:8px;">
          <div><span style="font-size:13px;">${info.icono}</span><span style="font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.07em; color:${info.color};">&nbsp;${info.titulo}</span></div>
          ${botonCopiar(contenido)}
        </div>
        <div style="color:${colorTexto}; line-height:1.65; padding-left:12px; border-left:2px solid ${colorBorde};">${linkify(contenido)}</div>
      </div>`;
    }
    return html;
  }

  let filtroAgenciaTabla = 'todas';
  window.rlFiltrarTabla = function(valor){
    filtroAgenciaTabla = valor;
    renderTablaSeguimiento(window.__leads || []);
  };

  // Tabla de seguimiento tipo Excel: solo se muestra en la vista admin (sin token de agencia)
  function renderTablaSeguimiento(leads){
    const cont = document.getElementById('seguimiento');
    if(agenciaFiltro){ cont.innerHTML = ''; return; } // las agencias no ven esta tabla, solo su listado de cards

    const todosAsignados = leads.filter(c => c.estado === 'Asignado');
    if(todosAsignados.length === 0){
      cont.innerHTML = '<div class="rl-track-title">Seguimiento de asignaciones</div><div class="rl-track-wrap"><div class="rl-track-empty">Todavia no hay leads asignados a ninguna agencia.</div></div>';
      return;
    }

    const agenciasConLeads = [...new Set(todosAsignados.map(c => c.agencia_asignada))].sort();
    const filtrados = filtroAgenciaTabla === 'todas' ? todosAsignados : todosAsignados.filter(c => c.agencia_asignada === filtroAgenciaTabla);

    const selectorHtml = `<select class="rl-track-filtro" onchange="rlFiltrarTabla(this.value)">
      <option value="todas" ${filtroAgenciaTabla==='todas'?'selected':''}>Todas las agencias (${todosAsignados.length})</option>
      ${agenciasConLeads.map(a => `<option value="${a}" ${filtroAgenciaTabla===a?'selected':''}>${a} (${todosAsignados.filter(c=>c.agencia_asignada===a).length})</option>`).join('')}
    </select>`;

    const filasHtml = filtrados.map(c => `<tr>
      <td><span class="rl-track-brand">${c.marca}</span><span class="rl-track-domain">${c.dominio}</span></td>
      <td>${c.facturacion_estimada_mxn ? '$'+Number(c.facturacion_estimada_mxn).toLocaleString('es-MX')+' MXN' : '-'}</td>
      <td>${c.agencia_asignada || '-'}</td>
      <td>${badgePipeline(c.pipeline_status)}</td>
      <td>${c.fecha_asignacion || '-'}</td>
    </tr>`).join('');

    cont.innerHTML = `<div class="rl-track-title">
        <span>Seguimiento de asignaciones<span class="count">${filtrados.length} de ${todosAsignados.length} lead${todosAsignados.length!==1?'s':''}</span></span>
        ${selectorHtml}
      </div>
      <div class="rl-track-wrap">
        <table class="rl-track-table">
          <thead><tr><th>Marca</th><th>Facturación est.</th><th>Agencia</th><th>Pipeline</th><th>Fecha asig.</th></tr></thead>
          <tbody>${filasHtml}</tbody>
        </table>
      </div>`;
  }

  function cardHtml(c){
    const verInfo = !!infoAbierta[c.dominio];
    const verGuion = !!guionAbierto[c.dominio];
    let detalleHtml = '';
    if(verInfo){
      const filas = [];
      if(c.visitas_mensuales_estimadas) filas.push(`<div><span style="color:#6b7280;">Visitas/mes:</span> <b>${c.visitas_mensuales_estimadas}</b></div>`);
      if(c.porcentaje_trafico_pagado) filas.push(`<div><span style="color:#6b7280;">Tráfico pagado:</span> <b>${c.porcentaje_trafico_pagado}</b></div>`);
      if(c.ads_activos) filas.push(`<div><span style="color:#6b7280;">Ads (detalle):</span> ${linkify(c.ads_activos)}</div>`);
      if(c.contacto_nombre || c.contacto_telefono || c.contacto_correo || c.contacto_linkedin){
        const partes = [];
        if(c.contacto_nombre) partes.push(c.contacto_nombre + (c.contacto_cargo ? ' ('+c.contacto_cargo+')' : ''));
        if(c.contacto_telefono) partes.push('📞 '+c.contacto_telefono);
        if(c.contacto_correo) partes.push('✉️ '+c.contacto_correo);
        if(c.contacto_linkedin) partes.push(linkify(c.contacto_linkedin));
        filas.push(`<div><span style="color:#6b7280;">Contacto:</span> ${partes.join(' · ')}</div>`);
      }
      if(c.nota_calificacion) filas.push(`<div><span style="color:#6b7280;">Nota:</span> ${c.nota_calificacion}</div>`);
      detalleHtml = `<div class="rl-detail">${filas.join('') || 'Sin información adicional.'}</div>`;
    }
    const guionHtml = (verGuion && c.guion) ? `<div class="rl-detail">${formatearGuion(c.guion)}</div>` : '';
    return `<div class="rl-row">
      <div class="rl-row-top">
        <div class="rl-brand">
          <div class="rl-avatar">${iniciales(c.dominio)}</div>
          <div>
            <div class="rl-brand-name">${c.marca}</div>
            <div class="rl-domain"><a href="https://${c.dominio}" target="_blank" rel="noopener">${c.dominio}</a></div>
          </div>
        </div>
        <div class="rl-meta">
          ${c.facturacion_estimada_mxn ? `<div class="rl-meta-item">Facturación est. <b>$${Number(c.facturacion_estimada_mxn).toLocaleString('es-MX')} MXN/mes</b></div>` : ''}
          ${c.ads_activos ? `<div class="rl-meta-item" style="display:flex; align-items:center; gap:6px;">Ads: ${renderAdsIconos(c.ads_activos)}</div>` : ''}
          <div class="rl-meta-item">${badgePlataforma(c.plataforma)}</div>
          <div class="rl-meta-item">${badgeEstado(c.estado)}</div>
          <div class="rl-meta-item">${badgePipeline(c.pipeline_status)}</div>
          ${c.estado==='Asignado' && c.agencia_asignada ? `<div class="rl-meta-item">Asignado a <b>${c.agencia_asignada}</b></div>` : ''}
        </div>
        <div class="rl-actions">
          <select class="rl-pipeline-select" data-dominio="${c.dominio}" onchange="rlCambiarPipeline(this)">
            ${PIPELINE_OPCIONES.map(op => `<option value="${op}" ${ (c.pipeline_status||'Lead')===op ? 'selected' : ''}>${op}</option>`).join('')}
          </select>
          <button class="rl-btn" onclick="rlToggleInfo('${c.dominio}')">${verInfo?'Ocultar':'Más'} info</button>
          ${c.guion ? `<button class="rl-btn" onclick="rlToggleGuion('${c.dominio}')">${verGuion?'Ocultar':'Ver'} guion</button>` : ''}
        </div>
      </div>
      ${detalleHtml}
      ${guionHtml}
    </div>`;
  }

  let filtroFaseAgencia = 'todas';
  window.rlFiltrarFaseAgencia = function(fase){
    filtroFaseAgencia = filtroFaseAgencia === fase ? 'todas' : fase;
    render(window.__leads || []);
  };

  // Resumen tipo chips (como el de la app interna) con el conteo de leads de esta
  // agencia en cada fase del pipeline. Clic en un chip filtra/agrupa por esa fase.
  function resumenAgenciaHtml(leadsAgencia){
    return `<div class="rl-resumen">${PIPELINE_OPCIONES.map(fase => {
      const cantidad = leadsAgencia.filter(c => (c.pipeline_status || 'Lead') === fase).length;
      const c = PIPELINE_COLORES[fase];
      const activo = filtroFaseAgencia === fase;
      return `<div class="rl-chip ${activo?'activo':''}" style="background:${c.bg}; ${activo?'border-color:'+c.color+';':''}" onclick="rlFiltrarFaseAgencia('${fase}')">
        <b style="color:${c.color};">${cantidad}</b>${fase}
      </div>`;
    }).join('')}</div>`;
  }

  function render(leads){
    const cont = document.getElementById('lista');
    renderTablaSeguimiento(leads);

    if(agenciaFiltro){
      const leadsAgencia = leads.filter(c => c.agencia_asignada === agenciaFiltro);
      if(leadsAgencia.length === 0){
        cont.innerHTML = '<div class="empty">Todavia no tienes leads asignados.</div>';
        return;
      }
      const gruposHtml = PIPELINE_OPCIONES
        .filter(fase => filtroFaseAgencia === 'todas' || filtroFaseAgencia === fase)
        .map(fase => {
          const items = leadsAgencia.filter(c => (c.pipeline_status || 'Lead') === fase);
          if(items.length === 0) return '';
          return `<div class="rl-fase-group">
            <div class="rl-fase-title" style="color:${PIPELINE_COLORES[fase].color};">${fase} (${items.length})</div>
            ${items.map(cardHtml).join('')}
          </div>`;
        }).filter(Boolean).join('');
      cont.innerHTML = resumenAgenciaHtml(leadsAgencia) + (gruposHtml || '<div class="empty">No hay leads en esta fase.</div>');
      return;
    }

    if(leads.length === 0){
      cont.innerHTML = '<div class="empty">No hay leads en este reporte.</div>';
      return;
    }
    cont.innerHTML = leads.map(cardHtml).join('');
  }

  fetch(basePath + 'leads.json?_=' + Date.now())
    .then(r => {
      if(!r.ok) throw new Error('No se pudo cargar leads.json');
      return r.json();
    })
    .then(data => {
      const leads = Array.isArray(data) ? data : (data.leads || []);
      const actualizado = Array.isArray(data) ? null : data.actualizado;
      document.getElementById('updated').textContent = 'Actualizado: ' + (actualizado || new Date().toLocaleDateString('es-MX', { year:'numeric', month:'long', day:'numeric' }));

      const tokens = (!Array.isArray(data) && data.agencia_tokens) || {};
      if(tokenAgencia){
        agenciaFiltro = tokens[tokenAgencia] || tokenAgencia; // si el token no esta en el mapa, se usa tal cual (compatibilidad con links viejos)
        document.getElementById('titulo').innerHTML = 'Leads asignados a <em>' + agenciaFiltro + '</em>';
        document.getElementById('subtitulo').textContent = 'Vista de solo lectura, exclusiva para ' + agenciaFiltro + '.';

        const logoUrl = AGENCIA_LOGOS[agenciaFiltro];
        if(logoUrl){
          document.getElementById('agencyLogoImg').src = logoUrl;
          document.getElementById('agencyLogoImg').alt = agenciaFiltro;
          document.getElementById('agencyLogoWrap').style.display = 'flex';
        }
      }

      window.__leads = leads;
      render(leads);

      // Aplica los status de pipeline guardados en Vercel KV (si los hay), sin bloquear el render inicial
      function sincronizarPipelineStatus(){
        return fetch('/api/pipeline')
          .then(r => r.ok ? r.json() : {})
          .then(mapa => {
            Object.keys(mapa || {}).forEach(dominio => {
              const lead = leads.find(l => l.dominio === dominio);
              if(lead) lead.pipeline_status = mapa[dominio];
            });
            render(leads);
          })
          .catch(err => console.warn('No se pudo cargar el status de pipeline guardado:', err.message));
      }
      sincronizarPipelineStatus();

      // En la vista admin, refresca solo cada 30s para que la tabla de seguimiento
      // refleje los cambios que hagan las agencias desde sus propias paginas.
      if(!agenciaFiltro) setInterval(sincronizarPipelineStatus, 30000);
    })
    .catch(err => {
      document.getElementById('lista').innerHTML = '<div class="error">No se pudo cargar leads.json (' + err.message + ')</div>';
    });
</script>
</body>
</html>
